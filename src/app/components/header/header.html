<header class="fixed inset-x-0 top-0 z-50 border-b border-transparent bg-white/75 backdrop-blur-xl transition duration-200"
        [class.border-border]="isScrolled" [class.shadow-soft]="isScrolled">
  <nav class="mx-auto flex h-[72px] max-w-7xl items-center justify-between gap-2 px-5 md:px-8" [attr.aria-label]="'Primary navigation' | tr">
    <button type="button" class="group flex shrink-0 items-center gap-3 text-start" (click)="scrollToSection('home')" [attr.aria-label]="'Go to home section' | tr">
      <span class="h-10 w-10 overflow-hidden rounded-xl border-2 border-white bg-slate-200 shadow-glow transition group-hover:rotate-2">
        <img src="assets/images/ahmed-salem-portrait.jpg" alt="" width="40" height="40" class="h-full w-full object-cover object-[center_28%]">
      </span>
      <span class="hidden sm:block">
        <strong class="block text-sm font-bold tracking-tight text-text-primary">{{ 'Ahmed Salem' | tr }}</strong>
        <small class="mt-0.5 block text-[10px] font-medium uppercase tracking-[0.12em] text-text-muted">{{ 'Software engineer' | tr }}</small>
      </span>
    </button>

    <div class="hidden items-center rounded-full border border-border bg-white/80 p-1 shadow-soft lg:flex">
      @for (item of navItems; track item.id) {
        <button type="button"
                class="rounded-full px-4 py-2 text-xs font-semibold text-text-secondary transition hover:text-text-primary"
                [class.bg-text-primary]="activeSection === item.id"
                [class.text-white]="activeSection === item.id"
                [attr.aria-current]="activeSection === item.id ? 'page' : null"
                (click)="scrollToSection(item.id)">
          {{ item.label | tr }}
        </button>
      }
    </div>

    <div class="flex shrink-0 items-center gap-2">
      <div class="flex items-center gap-1 rounded-xl border border-border bg-white p-1" role="group" [attr.aria-label]="'Language' | tr">
        <button type="button" class="preference-button preference-button--language" [class.preference-button--active]="preferences.language() === 'en'" [attr.aria-pressed]="preferences.language() === 'en'" aria-label="English" lang="en" (click)="preferences.setLanguage('en')">EN</button>
        <button type="button" class="preference-button preference-button--language" [class.preference-button--active]="preferences.language() === 'ar'" [attr.aria-pressed]="preferences.language() === 'ar'" aria-label="العربية" lang="ar" (click)="preferences.setLanguage('ar')">ع</button>
      </div>
      <button type="button" class="preference-button preference-button--theme" (click)="preferences.toggleTheme()" [attr.aria-label]="(preferences.theme() === 'light' ? 'Switch to dark theme' : 'Switch to light theme') | tr" [attr.title]="(preferences.theme() === 'light' ? 'Dark theme' : 'Light theme') | tr" [attr.aria-pressed]="preferences.theme() === 'dark'">
        <svg *ngIf="preferences.theme() === 'light'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5 8.5 8.5 0 1 0 20.5 14.5Z"/></svg>
        <svg *ngIf="preferences.theme() === 'dark'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
      </button>
      <button type="button" class="hidden rounded-xl bg-primary px-4 py-2.5 text-xs font-semibold text-white shadow-glow transition hover:bg-primary-dark md:block"
              (click)="scrollToSection('contact')">
        {{ 'Let\'s talk' | tr }} <span aria-hidden="true">↗</span>
      </button>
      <button type="button" class="grid h-11 w-11 place-items-center rounded-xl border border-border bg-white text-text-primary shadow-soft lg:hidden"
              (click)="toggleMenu()" [attr.aria-expanded]="isMenuOpen" aria-controls="mobile-menu" [attr.aria-label]="'Toggle navigation menu' | tr">
        <span class="space-y-1.5" aria-hidden="true">
          <span class="block h-0.5 w-5 rounded-full bg-current transition" [class.translate-y-1]="isMenuOpen" [class.rotate-45]="isMenuOpen"></span>
          <span class="block h-0.5 w-5 rounded-full bg-current transition" [class.-translate-y-1]="isMenuOpen" [class.-rotate-45]="isMenuOpen"></span>
        </span>
      </button>
    </div>
  </nav>

  <div id="mobile-menu" *ngIf="isMenuOpen" class="mx-4 mb-4 rounded-2xl border border-border bg-white p-2 shadow-card lg:hidden">
    @for (item of navItems; track item.id) {
      <button type="button" (click)="scrollToSection(item.id)"
              class="flex w-full items-center justify-between rounded-xl px-4 py-3 text-left text-sm font-semibold text-text-secondary transition hover:bg-slate-50"
              [class.bg-blue-50]="activeSection === item.id" [class.text-primary]="activeSection === item.id">
        {{ item.label | tr }} <span aria-hidden="true">→</span>
      </button>
    }
  </div>
</header>
