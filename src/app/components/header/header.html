<header class="site-header" [class.site-header--scrolled]="isScrolled">
  <nav class="mx-auto flex max-w-7xl items-center justify-between px-5 py-3 md:px-8" aria-label="Primary navigation">
    <button type="button" class="wordmark" (click)="scrollToSection('home')" aria-label="Go to home section">
      <span class="wordmark__stamp">AS</span>
      <span class="wordmark__text">
        <strong>Ahmed Salem</strong>
        <small>Full-stack engineer</small>
      </span>
    </button>

    <div class="hidden items-center gap-1 lg:flex">
      @for (item of navItems; track item.id; let index = $index) {
        <button
          type="button"
          class="nav-link"
          [class.nav-link--active]="activeSection === item.id"
          [attr.aria-current]="activeSection === item.id ? 'page' : null"
          (click)="scrollToSection(item.id)">
          <span>0{{ index + 1 }}</span>{{ item.label }}
        </button>
      }
    </div>

    <div class="flex items-center gap-3">
      <button type="button" class="hidden border-b-2 border-secondary pb-1 font-tajawal text-xs font-semibold uppercase tracking-wider text-text-primary md:block"
              (click)="scrollToSection('contact')">
        Start a conversation
      </button>
      <button type="button" class="menu-button lg:hidden" (click)="toggleMenu()"
              [attr.aria-expanded]="isMenuOpen" aria-controls="mobile-menu" aria-label="Toggle navigation menu">
        <span></span><span></span>
      </button>
    </div>
  </nav>

  <div id="mobile-menu" *ngIf="isMenuOpen" class="mobile-menu lg:hidden">
    @for (item of navItems; track item.id; let index = $index) {
      <button type="button" (click)="scrollToSection(item.id)"
              [class.mobile-menu__link--active]="activeSection === item.id"
              class="mobile-menu__link">
        <span>0{{ index + 1 }}</span>{{ item.label }}
      </button>
    }
  </div>
</header>
