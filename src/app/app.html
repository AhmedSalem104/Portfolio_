<app-scroll-progress [progress]="scrollProgress"></app-scroll-progress>
<app-header [isScrolled]="isScrolled"></app-header>

<main>
  <section id="home" class="scroll-mt-20">
    <app-home></app-home>
  </section>

  <section id="about" class="scroll-mt-20 bg-white/55">
    @defer (on viewport) {
      <app-about></app-about>
    } @placeholder {
      <div class="min-h-[70vh]" aria-hidden="true"></div>
    }
  </section>

  <section id="skills" class="scroll-mt-20">
    @defer (on viewport) {
      <app-skills></app-skills>
    } @placeholder {
      <div class="min-h-[70vh]" aria-hidden="true"></div>
    }
  </section>

  <section id="projects" class="scroll-mt-20 bg-white/55">
    @defer (on viewport) {
      <app-projects></app-projects>
    } @placeholder {
      <div class="min-h-[70vh]" aria-hidden="true"></div>
    }
  </section>

  <section id="contact" class="scroll-mt-20">
    @defer (on viewport) {
      <app-contact></app-contact>
    } @placeholder {
      <div class="min-h-[70vh]" aria-hidden="true"></div>
    }
  </section>
</main>

<app-footer></app-footer>
<app-back-to-top [isVisible]="showBackToTop" [progress]="scrollProgress"></app-back-to-top>
<app-floating-contact></app-floating-contact>
